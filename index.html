<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <h1>To-Do List</h1>
        <p class="subtitle">Manage your task easily</p>

        <form id="todo-form">
            <div class="form-group">
                <label for="todo-input">Task</label>
                <input type="text" id="todo-input" placeholder="Enter new task" required>
            </div>
            <div class="form-group">
                <label for="date-input">Date</label>
                <input type="date" id="date-input" required>
            </div>   
            <button type="submit" class="btn btn-add">Add Task</button>
        </form>

        <div class="filter-section">
            <div class="filter-title">Filter</div>
            <div class="filter-buttons">
                <button class="btn btn-filter active" data-filter="all">All</button>
                <button class="btn btn-filter" data-filter="active">Progress</button>
                <button class="btn btn-filter" data-filter="completed">Complete</button>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                <th>TASK</th>
                <th>DATE</th>
                <th>STATUS</th>
                <th>ACTIONS</th>
                </tr>
            </thead>
            <tbody id="todo-list">
                <tr><td colspan="4" class="no-task">No task found</td></tr>
            </tbody>
        </table>
    </div>

    <script src="js/script.js" defer></script>
</body>
</html>
